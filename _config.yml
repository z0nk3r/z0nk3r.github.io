title: z0nk3r
description: "Security research, capabilities dev, CTF writeups, tutorials, and technical notes"
url: "https://z0nk3r.github.io"
baseurl: ""
author: "z0nk3r"
logo: /assets/images/social-preview.png

# Jekyll settings
markdown: kramdown
date_format: "%B %d, %Y"
permalink: /blog/:title/

collections:
  authors:
    output: true
    permalink: /authors/:name/
  references:
    output: true
    permalink: /references/:name/
  tag_pages:
    output: true
    permalink: /tags/:name/
  # ONE collection holds both topics and chapters - the join IS the file
  # placement (a doc's parent is its URL minus the last segment; no topic:
  # front-matter key exists). A doc WITH a chapter: key is a chapter, one
  # without is a topic - see _layouts/tutorial.html. :path keeps the
  # directory nesting in the URL; it does NOT slugify the way :name does,
  # so filenames must already be clean lowercase-hyphen slugs.
  tutorials:
    output: true
    permalink: /tutorials/:path/

# Hosted references don't need `layout: reference` repeated in every file - scoped to just
# this collection (not path: "" globally) so it can't leak into other content by accident.
# Same reasoning for the tutorials collection below - a collection doc with no layout
# renders with zero styling at all (see the project notes), so every new collection gets one of these.
defaults:
  - scope:
      path: ""
      type: references
    values:
      layout: reference
  - scope:
      path: ""
      type: tutorials
    values:
      layout: tutorial

# Build settings
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude from processing
exclude:
  - .jekyll-cache/
  - .sassc/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - README.md
  - SETUP.md
